<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf de Lancieux · Distance et météo</title>
<style>
:root{--bg:#f4f6ef;--fg:#1b281d;--mut:#5f6e60;--card:#fff;--ac:#2f7d3a;--bd:#d5dacd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101611;--fg:#e8efe6;--mut:#9aa99b;--card:#1b241c;--ac:#6cc577;--bd:#2d392e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101611;--fg:#e8efe6;--mut:#9aa99b;--card:#1b241c;--ac:#6cc577;--bd:#2d392e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px}
.m{color:var(--mut);font-size:13px;margin:4px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:10px;cursor:pointer}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.holes button{padding:12px 0;font-size:17px}
.stage{position:relative;overflow:hidden;display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:10px 0}
.wm{position:absolute;right:-8px;top:-34px;font-size:270px;font-weight:900;line-height:1;opacity:.07;pointer-events:none}
.mainc{flex:1;text-align:center;position:relative;min-width:0}
.side{width:86px;position:relative;font-size:14px}
.side b.par{font-size:34px;line-height:1}
.dbox{display:inline-block;border:4px solid #e11d2e;border-radius:14px;padding:2px 16px;font-size:58px;font-weight:800;line-height:1.15}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #0006;margin-right:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
</style></head><body><div id="app"></div>
<script>
const PAR=[4,3,5,4,3,4,4,4,5];
const TE=[['Blanc','#ecece6',[309,127,454,298,97,264,321,326,470]],['Jaune','#f2d21b',[283,112,425,281,97,258,275,326,445]],['Bleu','#1e9be0',[277,112,385,274,87,240,275,294,445]],['Rouge','#d62c2c',[243,101,348,242,87,235,226,294,399]]];
const G0=[[48.601016,-2.157887],[48.600568,-2.15844],[48.603115,-2.15783],[48.601474,-2.160012],[48.601804,-2.160423],[48.600956,-2.164063],[48.603762,-2.165395],[48.601136,-2.164868],[48.603768,-2.160696]],O0={2:[48.602541,-2.15807],3:[48.601912,-2.159548]};
let D={gr:{}},h=0;
try{D.gr=(JSON.parse(localStorage.getItem('golfL'))||{}).gr||{};h=Math.min(8,Math.max(0,+localStorage.getItem('golfH')||0))}catch(e){}
const sv=()=>{try{localStorage.setItem('golfL',JSON.stringify({gr:D.gr}));localStorage.setItem('golfH',h)}catch(e){}};
const gp=i=>D.gr[i]||{lat:G0[i][0],lon:G0[i][1]};
const $=id=>document.getElementById(id);
const rad=x=>x*Math.PI/180;
const hav=(a,b)=>{const dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon),x=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return(Math.atan2(y,x)*180/Math.PI+360)%360};
let pos=null,W=null,gerr='';
function go(i){h=i;sv();R()}
function mark(){if(!pos){alert(gerr||'Position GPS pas encore reçue.');return}D.gr[h]={lat:pos.lat,lon:pos.lon};sv();R()}
function gps(){if(!navigator.geolocation){gerr='GPS non disponible';return}
navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};gerr='';upd()},e=>{pos=null;gerr=e.code==1?'Autorise la localisation dans le navigateur':'Position GPS indisponible';upd()},{enableHighAccuracy:true,maximumAge:2000})}
async function wx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.602&longitude=-2.161&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&minutely_15=precipitation&forecast_minutely_15=16&wind_speed_unit=kmh&timezone=Europe%2FParis');const j=await r.json();
W={s:j.current.wind_speed_10m,g:j.current.wind_gusts_10m,d:j.current.wind_direction_10m,t:j.minutely_15?j.minutely_15.time:null,p:j.minutely_15?j.minutely_15.precipitation:null}}catch(e){}upd()}
const fm=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60:'');
function rain(){if(!W)return'…';if(!W.t)return'Prévision de pluie indisponible';
const now=Date.now(),T=W.t.map(s=>new Date(s).getTime()),P=W.p,n=T.length;let i=0;while(i<n&&T[i]+9e5<=now)i++;
if(i>=n)return'Prévision de pluie indisponible';
const w=k=>P[k]>=0.1;let a=i;while(a<n&&!w(a))a++;
if(a>=n)return'Pas de pluie prévue dans les '+fm(Math.round((T[n-1]+9e5-now)/6e4));
let b=a,pk=0;while(b<n&&w(b)){pk=Math.max(pk,P[b]*4);b++}
const st=Math.max(0,Math.round((T[a]-now)/6e4)),du=Math.round((T[b-1]+9e5-Math.max(now,T[a]))/6e4);
const it=pk<2.5?'faible':pk<7.6?'modérée':'forte';
return(st==0?'Pluie en cours':'Pluie dans '+fm(st))+'<br>'+(b>=n?'au moins ':'pendant ')+fm(du)+' · '+it}
function upd(){if(!$('dist'))return;const g=gp(h);let b=null,m='';
if(!pos){$('dist').textContent='…';m=gerr||'Recherche de la position…'}
else{$('dist').textContent=Math.round(hav(pos,g))+' m';b=brg(pos,g);m=pos.acc>25?'Précision GPS : '+Math.round(pos.acc)+' m':''}
$('gmsg').textContent=m;const o=O0[h];$('obs').textContent=o&&pos?'Fossé : '+Math.round(hav(pos,{lat:o[0],lon:o[1]}))+' m':'';
if(W){$('wspd').textContent=Math.round(W.s)+' km/h';const to=(W.d+180)%360,rel=b==null?null:(to-b+360)%360;
$('warr').style.transform='rotate('+Math.round(rel==null?to:rel)+'deg)';
$('wlab').textContent=(rel==null?'Vent · nord en haut':rel<45||rel>315?'Dans le dos':rel>135&&rel<225?'De face':'De travers')+' · rafales '+Math.round(W.g)}
$('rain').innerHTML=rain()}
function R(){$('app').innerHTML=`<div class="holes">${PAR.map((_,i)=>`<button class="${i==h?'on':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div>
<div class="stage"><div class="wm">${h+1}</div>
<div class="mainc"><svg viewBox="0 0 190 164" width="100%" style="max-width:250px"><path d="M30 80C20 40 70 15 110 20C160 22 185 55 170 90C160 118 120 128 90 122C55 118 38 105 30 80Z" fill="#3d9a47" stroke="#2c7a36" stroke-width="5"/><path d="M52 78C48 52 80 36 110 38C145 40 160 60 150 85C142 104 118 110 92 106C70 103 56 95 52 78Z" fill="#52b05a"/><circle cx="95" cy="122" r="8" fill="#e11d2e" stroke="#fff" stroke-width="3"/><line x1="95" y1="160" x2="95" y2="142" stroke="#e11d2e" stroke-width="5"/><polygon points="95,131 86,145 104,145" fill="#e11d2e"/></svg>
<div><span class="dbox" id="dist">…</span></div><p class="m" id="gmsg"></p><p id="obs" style="font-weight:600;margin:2px 0"></p></div>
<div class="side"><div class="m">Par</div><b class="par">${PAR[h]}</b><div class="m" style="margin-top:12px">Départ</div>${TE.map(t=>`<div><span class="dot" style="background:${t[1]}"></span>${t[2][h]} m</div>`).join('')}</div></div>
<div class="g2"><div class="card"><b id="warr" style="font-size:46px;display:inline-block;line-height:1;transition:transform .4s">↑</b><div><b id="wspd" style="font-size:24px">…</b></div><div class="m" id="wlab">Vent</div></div>
<div class="card"><div class="m">Pluie</div><div id="rain" style="font-size:15px;margin-top:6px">…</div></div></div>
<button style="width:100%;margin-top:10px" onclick="mark()">${D.gr[h]?'Green corrigé par moi · le refaire ici':'Corriger ce green depuis ma position'}</button>`;upd()}
function wl(){try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()});
wl();gps();wx();setInterval(wx,600000);R();
</script></body></html>
